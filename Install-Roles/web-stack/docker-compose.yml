version: '3.8'

services:
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./app/www:/app/www:rw
      - ./app/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/nginx/letsencrypt:/etc/letsencrypt:rw
      - ./app/nginx/letsencrypt-site:/var/www/certbot:rw
    depends_on:
      - php

  certbot:
    image: certbot/certbot
    volumes:
      - ./app/nginx/letsencrypt:/etc/letsencrypt:rw
      - ./app/nginx/letsencrypt-site:/var/www/certbot:rw
    entrypoint: "/bin/sh -c '
      trap exit TERM;
      while :; do
        sleep 12h & wait $${!};
        certbot renew;
      done'"

  php:
    image: php:8.1-fpm
    volumes:
      - ./app/www:/app/www:rw
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  letsencrypt-data:
